{% set name = "opentelemetry-instrumentation" %}
{% set version = "0.66b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: e79a510f7d87c72d95e964ddb42193a0d9a75668c027d980eab032ea1322a5ce

build:
  number: 0
  entry_points:
    - opentelemetry-instrument = opentelemetry.instrumentation.auto_instrumentation:run
    - opentelemetry-bootstrap = opentelemetry.instrumentation.bootstrap:run
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - pip
    - python 
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.4,<2
    - opentelemetry-semantic-conventions =={{ version }}
    - wrapt >=1.0.0,<3.0.0
    - packaging >=18.0

# Unable to run the tests, opentelemetry-test-utils is not in the main channel. No module named 'opentelemetry.test'.
test:
  imports:
    - opentelemetry.instrumentation
  commands:
    - pip check
    - opentelemetry-instrument --help
    - opentelemetry-bootstrap --help
  requires:
    - pip

about:
  home: https://github.com/open-telemetry/opentelemetry-python
  license_family: APACHE
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Instrumentation Tools & Auto Instrumentation for OpenTelemetry Python
  description: |
    OpenTelemetry Instrumentation provides tools and auto-instrumentation for OpenTelemetry Python.
    This package is intended to be used in conjunction with the OpenTelemetry SDK.
  dev_url: https://github.com/open-telemetry/opentelemetry-python
  doc_url: https://opentelemetry.io/docs/getting-started/dev

extra:
  recipe-maintainers:
    - rxm7706
    - twoodwark
    - mariusvniekerk